<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">ORBIT mark: planet with a tilted ring and a small moon (as drawn by the app)</title>
  <defs>
    <linearGradient id="planet" x1="0.2" y1="0.15" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#8fb5ff"/>
      <stop offset="1" stop-color="#2c63d8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="front"><rect x="0" y="128" width="256" height="128" transform="rotate(-30 128 128)"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="120" fill="url(#glow)"/>
  <!-- ring, back half (behind the planet) -->
  <ellipse cx="128" cy="128" rx="104" ry="32" transform="rotate(-30 128 128)" fill="none" stroke="#4f8cff" stroke-width="7"/>
  <circle cx="128" cy="128" r="42" fill="url(#planet)"/>
  <!-- ring, front half (over the planet) -->
  <ellipse cx="128" cy="128" rx="104" ry="32" transform="rotate(-30 128 128)" fill="none" stroke="#4f8cff" stroke-width="7" clip-path="url(#front)"/>
  <circle cx="212" cy="78" r="9" fill="#a66bff"/>
</svg>
