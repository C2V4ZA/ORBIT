<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">ORBIT — Modern Communication for PlayStation 3</title>
  <desc id="d">Banner with the ORBIT planet mark on a dark space background with blue and violet light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080b"/>
      <stop offset="0.55" stop-color="#0b1122"/>
      <stop offset="1" stop-color="#140d24"/>
    </linearGradient>
    <radialGradient id="blue" cx="0.22" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#a66bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a66bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0.2" y1="0.15" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#8fb5ff"/>
      <stop offset="1" stop-color="#2c63d8"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d8ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#a66bff"/>
    </linearGradient>
    <clipPath id="front"><rect x="140" y="180" width="300" height="200" transform="rotate(-30 290 180)"/></clipPath>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#blue)"/>
  <rect width="1280" height="360" fill="url(#violet)"/>
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="1.2" opacity="0.7"/><circle cx="510" cy="40" r="1" opacity="0.5"/>
    <circle cx="620" cy="300" r="1.4" opacity="0.6"/><circle cx="960" cy="70" r="1" opacity="0.6"/>
    <circle cx="1180" cy="250" r="1.3" opacity="0.7"/><circle cx="1050" cy="320" r="0.9" opacity="0.5"/>
    <circle cx="360" cy="320" r="1" opacity="0.5"/><circle cx="1230" cy="40" r="1.1" opacity="0.6"/>
    <circle cx="740" cy="110" r="0.8" opacity="0.4"/><circle cx="200" cy="300" r="1" opacity="0.5"/>
  </g>
  <!-- mark -->
  <ellipse cx="290" cy="180" rx="150" ry="46" transform="rotate(-30 290 180)" fill="none" stroke="#4f8cff" stroke-width="8"/>
  <circle cx="290" cy="180" r="62" fill="url(#planet)"/>
  <ellipse cx="290" cy="180" rx="150" ry="46" transform="rotate(-30 290 180)" fill="none" stroke="#4f8cff" stroke-width="8" clip-path="url(#front)"/>
  <circle cx="411" cy="108" r="12" fill="#a66bff"/>
  <!-- wordmark -->
  <text x="520" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="104" font-weight="800" letter-spacing="10" fill="url(#word)">ORBIT</text>
  <rect x="524" y="200" width="300" height="4" rx="2" fill="url(#line)"/>
  <text x="522" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="600" fill="#e8ecf5">Modern Communication for PlayStation 3</text>
  <text x="522" y="290" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" fill="#9aa1ab">Text · Voice · Friends · Communities</text>
</svg>
