name: Desktop tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build Mbed TLS 2.28.10 (host)
        run: |
          curl -fsSL https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v2.28.10.tar.gz | tar xz
          make -C mbedtls-2.28.10 lib -j"$(nproc)"

      - name: Run the desktop test suite
        run: make test MBED="$PWD/mbedtls-2.28.10"
